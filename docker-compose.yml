services:
  db:
    image: postgres:15-alpine
    container_name: ssfm-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: ssfm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ssfm-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
